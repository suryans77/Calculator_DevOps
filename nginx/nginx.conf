events {}

http {
    # Log which replica served each request
    log_format upstream '$remote_addr "$request" $status upstream=$upstream_addr';
    access_log /var/log/nginx/access.log upstream;

    # Docker's embedded DNS; re-resolve "app" so replica restarts/IP changes are picked up
    resolver 127.0.0.11 valid=10s ipv6=off;

    # "app" resolves to every replica's IP, so nginx round-robins across them
    upstream calculator {
        zone calculator 64k;
        server app:8081 resolve;
    }

    server {
        listen 80;

        # nginx's own health endpoint (used by its compose healthcheck)
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://calculator;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
